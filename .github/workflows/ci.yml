name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example

      - name: Format
        working-directory: example
        run: cargo fmt --check

      - name: Clippy
        working-directory: example
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build
        working-directory: example
        run: cargo build --release --locked

      - name: Test
        working-directory: example
        run: cargo test --locked

      - name: Conformance
        working-directory: example
        run: ../conformance/conformance.sh target/release/greeter

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JSON Schema contracts
        run: |
          python -m pip install -r conformance/requirements.txt
          python conformance/validate.py example/target/release/greeter --example

      - name: Discovery measurements
        run: python conformance/measure.py example/target/release/greeter --command hello --resources > discovery-measurements.json

      - uses: actions/upload-artifact@v4
        with:
          name: discovery-measurements-${{ matrix.os }}
          path: discovery-measurements.json
