[package]
name = "greeter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal agent-friendly CLI example"
license = "MIT"
repository = "https://github.com/paperfoot/agent-cli-framework"

[[bin]]
name = "greeter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
figment = { version = "0.10", features = ["toml", "env"] }
directories = "6"
which = "8"
chrono = "0.4"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
